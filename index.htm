<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cigarette Count Sheet</title>
<style>
:root {
  --panel: rgba(24, 24, 24, .91);
  --line: rgba(255,255,255,.28);
  --accent: #f0b429;
  --input: rgba(12,12,12,.92);
  --input-alt: rgba(48,48,48,.94);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 18px;
  color: #fff; font-family: Arial, Helvetica, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.82)),
    url('background.jpg') center center / cover fixed no-repeat,
    #080808;
}
.page { max-width: 1500px; margin: 0 auto; }
.title {
  text-align:center; font-size: clamp(1.65rem, 3vw, 2.4rem);
  font-weight: 800; padding: 4px 0 12px; margin-bottom: 20px;
  border-bottom: 2px solid rgba(255,255,255,.8);
}
#loading-indicator {
  display:none; text-align:center; color:var(--accent);
  font-weight:bold; margin: 0 0 14px;
}
.sheet {
  display:grid;
  grid-template-columns: minmax(145px, .95fr) minmax(280px, 2.15fr)
    minmax(150px, 1.05fr) minmax(150px, 1.05fr) minmax(190px, 1.25fr);
  grid-template-areas:
    "wall top register back totals"
    "wall cabinets register back totals"
    "wall name box back totals"
    "wall date damaged overflow totals";
  gap: 16px;
  align-items:stretch;
}
.panel {
  min-width:0; padding: 10px; border:1px solid var(--line);
  border-radius: 4px; background:var(--panel);
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}
.wall { grid-area:wall; }
.top { grid-area:top; }
.cabinets { grid-area:cabinets; }
.register { grid-area:register; }
.back { grid-area:back; }
.box-panel { grid-area:box; }
.name-panel { grid-area:name; }
.date-panel { grid-area:date; }
.damaged { grid-area:damaged; }
.overflow { grid-area:overflow; }
.totals {
  grid-area:totals; display:flex; flex-direction:column;
  justify-content:center; gap:28px; padding:22px 18px;
  background:rgba(95,95,95,.88);
}
.section-title {
  font-size:clamp(1rem,1.4vw,1.3rem); font-weight:800;
  text-align:center; margin:0 0 7px; min-height:25px;
}
.fields { display:grid; gap:0; }
.fields.one { grid-template-columns:1fr; }
.fields.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
.field {
  width:100%; min-width:0; height:76px; border:1px solid rgba(255,255,255,.65);
  border-radius:0; background:var(--input); color:#fff;
  text-align:center; font-size:1.2rem; font-weight:600;
  padding:8px; outline:none;
}
.fields .field:nth-child(even) { background:var(--input-alt); }
.field:focus { border:2px solid #37c879; background:#202820; }
.field::placeholder { color:rgba(255,255,255,.3); }
.wall .field, .register .field, .back .field { height:76px; }
.top .field, .box-panel .field, .name-panel .field, .date-panel .field { height:76px; }
.cabinets .field { height:90px; }
.tall .field { height:180px; }
.name-panel .field { text-align:left; padding-left:12px; }
.date-panel .field { color-scheme:dark; }
.totals .total-group { text-align:center; }
.totals label {
  display:block; font-weight:800; font-size:1.35rem; margin-bottom:6px;
}
.total-output {
  width:100%; height:72px; border:3px solid #111; background:#080808;
  color:#fff; text-align:center; font-size:1.8rem; font-weight:800;
  border-radius:0; padding:8px;
}
.total-output.final { border-color:#111; }
.live-clock {
  text-align:center; margin-top:8px; color:#ffe08a;
  font-size:.95rem; font-weight:700; min-height:20px;
}
.button-group {
  display:flex; justify-content:center; flex-wrap:wrap; gap:12px;
  margin:20px 0 8px;
}
button {
  border:0; border-radius:4px; padding:13px 20px;
  color:#fff; font-size:1rem; font-weight:800; cursor:pointer;
}
button:disabled { opacity:.55; cursor:wait; }
.btn-history { background:#0878d1; }
.btn-save { background:#218838; }
.btn-clear { background:#c92d3a; }
#history-overlay {
  display:none; position:fixed; inset:0; z-index:1000;
  overflow-y:auto; padding:16px; background:rgba(0,0,0,.97);
}
.close-history {
  position:sticky; top:0; width:100%; z-index:2;
  margin-bottom:14px; background:#444; text-align:center;
}
.history-card {
  max-width:900px; margin:0 auto 16px; padding:14px;
  border:1px solid #555; border-radius:7px; background:#202020;
}
.history-card-title {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding-bottom:10px; border-bottom:1px solid #555;
}
.history-meta { color:#bbb; font-size:.9rem; margin-top:4px; }
.history-totals {
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;
}
.history-total {
  padding:10px 5px; text-align:center; background:#111;
  border:1px solid #555; border-radius:4px;
}
.history-total strong { display:block; color:#83d99b; font-size:1.25rem; margin-top:4px; }
.history-details { color:#ccc; font-size:.9rem; margin-top:10px; }
@media (max-width: 850px) {
  body { padding:10px; background-attachment:scroll; }
  .title { margin-bottom:14px; }
  .sheet {
    display:flex; flex-direction:column; gap:12px;
  }
  .panel { width:100%; padding:10px; }
  .section-title { font-size:1.1rem; }
  .wall .fields { grid-template-columns:1fr; }
  .cabinets .fields.four { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .wall .field { height:58px; }
  .top .field, .box-panel .field, .name-panel .field, .date-panel .field { height:58px; }
  .register .field, .back .field { height:58px; }
  .cabinets .field { height:64px; }
  .tall .field { height:100px; }
  .totals {
    display:grid; grid-template-columns:1fr; gap:12px;
    padding:14px;
  }
  .total-output { height:58px; font-size:1.5rem; }
  .totals label { font-size:1.1rem; }
  .button-group { position:static; gap:8px; }
  .button-group button { flex:1 1 135px; padding:13px 10px; }
}
@media (min-width:851px) and (max-width:1100px) {
  .sheet { grid-template-columns: .9fr 1.6fr .95fr .95fr 1.1fr; gap:9px; }
  .field { height:64px; }
  .wall .field, .register .field, .back .field { height:64px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="title">Cigarette Count Sheet</div>
  <div id="loading-indicator">Updating Cloud Data...</div>

  <main class="sheet" id="main-form">
    <section class="panel wall">
      <h2 class="section-title">Wall Rack</h2>
      <div class="fields one" id="wall-fields">
        <input class="field count-input" type="number" min="0" step="1" id="wr_1" aria-label="Wall Rack 1">
        <input class="field count-input" type="number" min="0" step="1" id="wr_2" aria-label="Wall Rack 2">
        <input class="field count-input" type="number" min="0" step="1" id="wr_3" aria-label="Wall Rack 3">
        <input class="field count-input" type="number" min="0" step="1" id="wr_4" aria-label="Wall Rack 4">
        <input class="field count-input" type="number" min="0" step="1" id="wr_5" aria-label="Wall Rack 5">
        <input class="field count-input" type="number" min="0" step="1" id="wr_6" aria-label="Wall Rack 6">
        <input class="field count-input" type="number" min="0" step="1" id="wr_7" aria-label="Wall Rack 7">
        <input class="field count-input" type="number" min="0" step="1" id="wr_8" aria-label="Wall Rack 8">
      </div>
    </section>

    <section class="panel top">
      <h2 class="section-title">Top Shelf</h2>
      <div class="fields one">
        <input class="field count-input" type="number" min="0" step="1" id="top_shelf" aria-label="Top Shelf">
      </div>
    </section>

    <section class="panel cabinets">
      <h2 class="section-title">Top Cabinets</h2>
      <div class="fields four">
        <input class="field count-input" type="number" min="0" step="1" id="top_cab_1" aria-label="Top Cabinet 1">
        <input class="field count-input" type="number" min="0" step="1" id="top_cab_2" aria-label="Top Cabinet 2">
        <input class="field count-input" type="number" min="0" step="1" id="top_cab_3" aria-label="Top Cabinet 3">
        <input class="field count-input" type="number" min="0" step="1" id="top_cab_4" aria-label="Top Cabinet 4">
      </div>
    </section>

    <section class="panel register">
      <h2 class="section-title">Register 1</h2>
      <div class="fields one">
        <input class="field count-input" type="number" min="0" step="1" id="reg1_1" aria-label="Register 1 shelf 1">
        <input class="field count-input" type="number" min="0" step="1" id="reg1_2" aria-label="Register 1 shelf 2">
        <input class="field count-input" type="number" min="0" step="1" id="reg1_3" aria-label="Register 1 shelf 3">
      </div>
    </section>

    <section class="panel back">
      <h2 class="section-title">Back Cabinet</h2>
      <div class="fields one">
        <input class="field count-input" type="number" min="0" step="1" id="back_cab_1" aria-label="Back Cabinet 1">
        <input class="field count-input" type="number" min="0" step="1" id="back_cab_2" aria-label="Back Cabinet 2">
        <input class="field count-input" type="number" min="0" step="1" id="back_cab_3" aria-label="Back Cabinet 3">
        <input class="field count-input" type="number" min="0" step="1" id="back_cab_4" aria-label="Back Cabinet 4">
      </div>
    </section>

    <section class="panel box-panel">
      <h2 class="section-title">Box</h2>
      <div class="fields one">
        <input class="field count-input" type="number" min="0" step="1" id="box" aria-label="Box">
      </div>
    </section>

    <section class="panel name-panel">
      <h2 class="section-title" style="text-align:left">Name</h2>
      <input class="field" type="text" id="count_name" autocomplete="name" aria-label="Name">
    </section>

    <section class="panel date-panel">
      <h2 class="section-title" style="text-align:left">Date</h2>
      <input class="field" type="date" id="count_date" aria-label="Count date">
      <div class="live-clock" id="live-clock">--:--:--</div>
    </section>

    <section class="panel damaged tall">
      <h2 class="section-title">Damaged</h2>
      <div class="fields one">
        <input class="field count-input" type="number" min="0" step="1" id="damaged" aria-label="Damaged packs">
      </div>
    </section>

    <section class="panel overflow tall">
      <h2 class="section-title">Back Overflow</h2>
      <div class="fields one">
        <input class="field count-input" type="number" min="0" step="1" id="back_overflow" aria-label="Back Overflow cartons">
      </div>
    </section>

    <section class="panel totals">
      <div class="total-group">
        <label for="pack_total">Pack Total</label>
        <input class="total-output" type="text" id="pack_total" readonly>
      </div>
      <div class="total-group">
        <label for="carton_total">Carton Total</label>
        <input class="total-output" type="text" id="carton_total" readonly>
      </div>
      <div class="total-group">
        <label for="total">Total</label>
        <input class="total-output final" type="text" id="total" readonly>
      </div>
      <div class="total-group">
        <label for="variance">Variance vs Prev</label>
        <input class="total-output" type="text" id="variance" readonly placeholder="—">
      </div>
    </section>
  </main>

  <div class="button-group">
    <button class="btn-history" id="histBtn" type="button" onclick="openHistory()">History Log</button>
    <button class="btn-save" id="saveBtn" type="button" onclick="manualSave()">Save Snapshot</button>
    <button class="btn-clear" id="clearBtn" type="button" onclick="clearSheet()">Clear All</button>
  </div>
</div>

<div id="history-overlay">
  <button class="close-history" type="button" onclick="closeHistory()">← CLOSE HISTORY</button>
  <div id="history-content"></div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwqfOudYodS3A31jl16OfrCQ0k5QV4toNJ_bMo0IxPRsxfbH7R1G8K2ALk9uR5YvrWkNA/exec';
const STORAGE_KEY = 'cig_sheet_local_temp';
const INPUT_IDS = [
  'wr_1','wr_2','wr_3','wr_4','wr_5','wr_6','wr_7','wr_8',
  'top_shelf','top_cab_1','top_cab_2','top_cab_3','top_cab_4',
  'reg1_1','reg1_2','reg1_3',
  'back_cab_1','back_cab_2','back_cab_3','back_cab_4',
  'box','count_name','count_date','damaged','back_overflow'
];
const PACK_FIELDS = ['wr_1','wr_2','wr_3','wr_4','wr_5','wr_6','wr_7','wr_8',
  'reg1_1','reg1_2','reg1_3','box','damaged'];
const CARTON_FIELDS = ['top_shelf','top_cab_1','top_cab_2','top_cab_3','top_cab_4',
  'back_cab_1','back_cab_2','back_cab_3','back_cab_4','back_overflow'];
const LEGACY_WALL_FIELDS = Array.from({length:8}, (_,i) => [`wr_l_${i+1}`,`wr_r_${i+1}`]);
let cloudHistory = [];
let previousTotal = 0;
let busy = false;

function valueOf(id) {
  return Number.parseFloat(document.getElementById(id)?.value) || 0;
}
function sumFields(fields) {
  return fields.reduce((sum,id) => sum + valueOf(id), 0);
}
function updateClock() {
  document.getElementById('live-clock').textContent =
    new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000);

function showLoading(show) {
  busy = show;
  document.getElementById('loading-indicator').style.display = show ? 'block' : 'none';
  ['saveBtn','clearBtn'].forEach(id => document.getElementById(id).disabled = show);
}
function calculate() {
  const packs = sumFields(PACK_FIELDS);
  const cartons = sumFields(CARTON_FIELDS);
  const finalTotal = packs + cartons * 10;
  document.getElementById('pack_total').value = packs || '';
  document.getElementById('carton_total').value = cartons || '';
  document.getElementById('total').value = finalTotal || '';
  const variance = document.getElementById('variance');
  if (finalTotal > 0 && previousTotal > 0) {
    const diff = finalTotal - previousTotal;
    variance.value = (diff > 0 ? '+' : '') + diff;
    variance.style.color = diff < 0 ? '#c92d3a' : diff > 0 ? '#218838' : '#b77900';
  } else {
    variance.value = '';
    variance.style.color = '#111';
  }
  saveLocalProgress();
}
function collectData() {
  const data = {};
  INPUT_IDS.forEach(id => data[id] = document.getElementById(id).value);
  return data;
}
function saveLocalProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectData())); }
  catch (e) { console.warn('Local save unavailable', e); }
}

// Read both the new format and older cloud snapshots without changing the cloud service.
function normalizeLegacyData(source) {
  const d = {...(source || {})};
  if (!('wr_1' in d)) {
    LEGACY_WALL_FIELDS.forEach((pair,i) => {
      const a = Number.parseFloat(d[pair[0]]) || 0;
      const b = Number.parseFloat(d[pair[1]]) || 0;
      d[`wr_${i+1}`] = (a + b) || '';
    });
  }
  if (!('reg1_1' in d)) {
    ['r1','r2','r3'].forEach((old,i) => d[`reg1_${i+1}`] = d[`reg1_${old}`] || '');
  }
  if (!('top_shelf' in d)) d.top_shelf = d.top_shelf_qty || '';
  if (!('box' in d)) d.box = d.pack_box_input || '';
  if (!('back_overflow' in d)) d.back_overflow = d.back_drawer || '';
  if (!('back_cab_1' in d)) d.back_cab_1 = d.back_room_qty || '';
  if (!('damaged' in d)) d.damaged = d.damaged || '';
  return d;
}
function calculateSnapshot(data) {
  const d = normalizeLegacyData(data);
  const num = id => Number.parseFloat(d[id]) || 0;
  let packs = PACK_FIELDS.reduce((s,id) => s + num(id), 0);
  let cartons = CARTON_FIELDS.reduce((s,id) => s + num(id), 0);
  // Old history stored two wall-rack columns and the old register layout.
  if (!('wr_1' in (data || {}))) {
    packs = LEGACY_WALL_FIELDS.flat().reduce((s,id) => s + (Number.parseFloat(data?.[id]) || 0), 0)
      + ['reg1_r1','reg1_r2','reg1_r3','pack_box_input','damaged'].reduce((s,id) => s + (Number.parseFloat(data?.[id]) || 0), 0);
    cartons = ['top_shelf_qty','back_room_qty','back_drawer'].reduce((s,id) => s + (Number.parseFloat(data?.[id]) || 0), 0);
  }
  return {packs, cartons, total:packs + cartons * 10, data:d};
}
async function loadData() {
  showLoading(true);
  try {
    const localSaved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (localSaved) {
      const normalized = normalizeLegacyData(localSaved);
      INPUT_IDS.forEach(id => {
        const el = document.getElementById(id);
        if (normalized[id] !== undefined && normalized[id] !== null) el.value = normalized[id];
      });
    }
    const response = await fetch(WEB_APP_URL, {cache:'no-store'});
    if (!response.ok) throw new Error(`Cloud returned ${response.status}`);
    const result = await response.json();
    cloudHistory = Array.isArray(result) ? result : [];
    if (cloudHistory.length) {
      const latest = calculateSnapshot(cloudHistory[0].fullData || {});
      previousTotal = latest.total;
      INPUT_IDS.forEach(id => {
        const field = document.getElementById(id);
        const val = latest.data[id];
        if (val !== undefined && val !== '') field.placeholder = val;
      });
    }
    calculate();
  } catch (error) {
    console.error('Cloud sync failed:', error);
    calculate();
  } finally {
    showLoading(false);
  }
}
async function syncToCloud(type) {
  const currentTotal = Number(document.getElementById('total').value) || 0;
  if (currentTotal <= 0) return false;
  showLoading(true);
  const payload = {
    type,
    date: document.getElementById('count_date').value || 'No Date',
    fullData: collectData()
  };
  try {
    const response = await fetch(WEB_APP_URL, {
      method:'POST',
      body:JSON.stringify(payload)
    });
    if (!response.ok) throw new Error(`Cloud save returned ${response.status}`);
    await loadData();
    return true;
  } catch (error) {
    console.error('Cloud save failed:', error);
    alert('Cloud save failed. Your current entries are still saved on this device.');
    return false;
  } finally {
    showLoading(false);
  }
}
async function manualSave() {
  if (busy) return;
  if (Number(document.getElementById('total').value) <= 0) {
    alert('Enter a count before saving a snapshot.');
    return;
  }
  const saved = await syncToCloud('Manual Save');
  if (saved) alert('Snapshot synced!');
}
async function clearSheet() {
  if (busy) return;
  if (!confirm('Save this count to cloud history and clear this device?')) return;
  if (Number(document.getElementById('total').value) > 0) {
    const saved = await syncToCloud('End of Shift');
    if (!saved) return;
  }
  INPUT_IDS.forEach(id => {
    const el = document.getElementById(id);
    el.value = '';
    el.placeholder = '';
  });
  previousTotal = cloudHistory.length ? calculateSnapshot(cloudHistory[0].fullData || {}).total : 0;
  localStorage.removeItem(STORAGE_KEY);
  calculate();
}
function openHistory() {
  renderHistoryCards();
  document.getElementById('history-overlay').style.display = 'block';
}
function renderHistoryCards() {
  const container = document.getElementById('history-content');
  if (!cloudHistory.length) {
    container.innerHTML = '<p style="text-align:center">No cloud history found.</p>';
    return;
  }
  container.innerHTML = '';
  cloudHistory.forEach((item,idx) => {
    const result = calculateSnapshot(item.fullData || {});
    const date = item.date && item.date !== 'No Date' ? item.date : 'Log Entry';
    const time = item.timestamp ? new Date(item.timestamp).toLocaleString() : 'Unknown time';
    const name = result.data.count_name || '';
    const card = document.createElement('section');
    card.className = 'history-card';
    const heading = document.createElement('div');
    heading.className = 'history-card-title';
    const meta = document.createElement('div');
    const dateEl = document.createElement('strong');
    dateEl.style.fontSize = '1.2rem';
    dateEl.textContent = `${date}${name ? ' — ' + name : ''}`;
    const timeEl = document.createElement('div');
    timeEl.className = 'history-meta';
    timeEl.textContent = time;
    meta.append(dateEl,timeEl);
    const restore = document.createElement('button');
    restore.textContent = 'RESTORE';
    restore.style.background = '#218838';
    restore.onclick = () => restoreFromHistory(idx);
    heading.append(meta,restore);
    const totals = document.createElement('div');
    totals.className = 'history-totals';
    [['Pack Total',result.packs],['Carton Total',result.cartons],['Total',result.total]].forEach(([label,val]) => {
      const box = document.createElement('div');
      box.className = 'history-total';
      box.textContent = label;
      const strong = document.createElement('strong');
      strong.textContent = val.toLocaleString();
      box.append(strong);
      totals.append(box);
    });
    const details = document.createElement('div');
    details.className = 'history-details';
    details.textContent = item.type ? `Entry type: ${item.type}` : '';
    card.append(heading,totals,details);
    container.append(card);
  });
}
function restoreFromHistory(idx) {
  const source = cloudHistory[idx]?.fullData || {};
  const data = normalizeLegacyData(source);
  INPUT_IDS.forEach(id => {
    const field = document.getElementById(id);
    field.value = data[id] ?? '';
  });
  calculate();
  closeHistory();
}
function closeHistory() {
  document.getElementById('history-overlay').style.display = 'none';
}
document.querySelectorAll('.count-input').forEach(el => el.addEventListener('input',calculate));
document.getElementById('count_name').addEventListener('input',saveLocalProgress);
document.getElementById('count_date').addEventListener('change',saveLocalProgress);
window.addEventListener('load',() => {
  updateClock();
  loadData();
});
</script>
</body>
</html>
